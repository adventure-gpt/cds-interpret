name: Release to PyPI

# Builds the sdist and wheel and publishes them to PyPI with Trusted Publishing (no API token anywhere): PyPI trusts
# this workflow in this repository. Runs on a version tag (v*) or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub release for the tag, its notes from the version's CHANGELOG section - so the repository's Releases list
  # never lags PyPI (0.7.0 went to PyPI on 10-23 with no GitHub release; it was made by hand on 10-29). Skipped when
  # the release already exists or the run is not for a tag.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then echo "release $GITHUB_REF_NAME exists"; exit 0; fi
          python - "$v" > notes.md <<'PY'
          import sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          head = f"## [{v}]"
          if head not in text:
              sys.exit(f"CHANGELOG.md has no section {head}")
          body = text.split(head, 1)[1].split("\n", 1)[1]
          body = body.split("\n## [", 1)[0].strip()
          print(body + f"\n\nOn PyPI: `pip install -U cds-interpret` ({v}).")
          PY
          gh release create "$GITHUB_REF_NAME" --title "cds-interpret $v" --notes-file notes.md --latest
